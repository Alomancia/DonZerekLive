<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargando Servidor</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #111; 
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Tarjeta del jugador en la esquina superior izquierda */
        .perfil-jugador {
            position: absolute;
            top: 30px;
            left: 30px;
            display: none;
            align-items: center;
            gap: 15px;
            background-color: rgba(255, 255, 255, 0.08);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .avatar-jugador {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid white;
            background-color: #222;
            object-fit: cover;
        }

        .nombre-jugador {
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .titulo-servidor {
            font-size: 4rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        .contenedor-carga {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .texto-carga {
            font-size: 2rem;
        }

        .gif-carga {
            width: 60px;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Contenedor del perfil en la esquina superior izquierda -->
    <div id="caja-perfil" class="perfil-jugador">
        <!-- Avatar oficial por defecto de Steam para que nunca se vea roto -->
        <img id="foto-steam" class="avatar-jugador" src="https://avatars.steamstatic.com/fef49e7fa7e1997310d705b2a6158ff8dc1cdfeb_full.jpg" alt="Avatar">
        <div id="nombre-steam" class="nombre-jugador">Cargando perfil...</div>
    </div>
    
    <div class="titulo-servidor">DonZerekLive</div>
    
    <div class="contenedor-carga">
        <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ljdTMwYmR4M2VicXdxajVzZ3B5N2Fpb2drbGh5eGdnaGZobjZpdSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/piJXo6lwZH3EqYu81i/giphy.gif" alt="Cargando" class="gif-carga">
        <div class="texto-carga">Cargando...</div>
        <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExc3FodWhka3lxaTVqMmZzaGRvdGp3eTcweTEzajQ1ZjR3bzdrY2R5ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/DH1Au7j1gCGxGOkvUm/giphy.gif" alt="Cargando" class="gif-carga">
    </div>
    
    <audio id="musica-fondo" autoplay loop></audio>

    <script>
        // --- 1. CONFIGURACIÓN DE MÚSICA ---
        var listaDeCanciones = [
            'songs/gozalo.mp3',
            'songs/gta.mp3',
            'songs/leche.mp3',
            'songs/nino_dios.mp3',
            'songs/undertale.mp3',
            'songs/zapatico.mp3'
        ];

        var cancionAleatoria = listaDeCanciones[Math.floor(Math.random() * listaDeCanciones.length)];
        var reproductor = document.getElementById('musica-fondo');
        reproductor.src = cancionAleatoria;
        reproductor.volume = 0.05;

        // --- 2. OBTENER PERFIL DE STEAM CON RESPALDO ---
        var parametrosUrl = new URLSearchParams(window.location.search);
        var steamId = parametrosUrl.get('steamid');

        function procesarXMLSteam(textoXml) {
            var parser = new DOMParser();
            var xmlDoc = parser.parseFromString(textoXml, "text/xml");
            
            var nombre = xmlDoc.getElementsByTagName("steamID")[0]?.textContent;
            var avatar = xmlDoc.getElementsByTagName("avatarFull")[0]?.textContent;

            if (nombre && avatar) {
                document.getElementById('nombre-steam').innerText = nombre;
                document.getElementById('foto-steam').src = avatar;
                return true;
            }
            return false;
        }

        if (steamId) {
            document.getElementById('caja-perfil').style.display = 'flex';
            document.getElementById('nombre-steam').innerText = "Bienvenido, jugador";

            var urlSteam = 'https://steamcommunity.com/profiles/' + steamId + '/?xml=1';

            // Intento 1: Proxy corsproxy.io (más rápido y estable con Steam)
            fetch('https://corsproxy.io/?' + encodeURIComponent(urlSteam))
                .then(res => {
                    if (!res.ok) throw new Error("Fallo Proxy 1");
                    return res.text();
                })
                .then(xml => {
                    if (!procesarXMLSteam(xml)) throw new Error("XML inválido");
                })
                .catch(() => {
                    // Intento 2 (Respaldo): Proxy codetabs si el primero falla
                    fetch('https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(urlSteam))
                        .then(res => res.text())
                        .then(xml => procesarXMLSteam(xml))
                        .catch(err => console.log("No se pudo obtener el perfil público:", err));
                });
        }
    </script>
</body>
</html>
