<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargando Servidor</title>
    <style>
        body {
            background-color: #111; 
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        /* Contenedor invisible para el video */
        #reproductor-youtube {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            z-index: -999;
        }
    </style>
</head>
<body>
    <h1>Cargando...</h1>
    
    <!-- Este div vacío es donde JavaScript insertará el video -->
    <div id="reproductor-youtube"></div>

    <script>
        // 1. Cargar la API de YouTube
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // 2. Configurar el reproductor
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('reproductor-youtube', {
                videoId: 'T8RTE4ZHhOU', // El ID de "Mi Zapatico"
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'T8RTE4ZHhOU' // Necesario para que el loop funcione
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        // 3. Bajar el volumen y darle play
        function onPlayerReady(event) {
            event.target.setVolume(0); // VOLUMEN: Cambia este número (0 a 100)
            event.target.playVideo();
        }
    </script>
</body>
</html>
