<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargando Servidor</title>
    <!-- 1. Importando la fuente moderna desde Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #111; 
            color: white;
            /* Aplicamos la nueva fuente a toda la página */
            font-family: 'Montserrat', sans-serif;
            display: flex;
            /* Flex-direction column apila los elementos de arriba hacia abajo (Título y luego Cargando) */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Estilo exclusivo para el título de tu servidor */
        .titulo-servidor {
            font-size: 4rem; /* Tamaño de letra muy grande */
            margin-bottom: 40px; /* Separación hacia abajo con los GIFs */
            text-transform: uppercase; /* Fuerza a que todo sea mayúscula */
            letter-spacing: 3px; /* Separa un poco las letras para que se vea mejor */
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7); /* Sombra suave para darle profundidad */
        }

        /* Esta caja invisible pone los GIFs y el texto en la misma línea */
        .contenedor-carga {
            display: flex;
            align-items: center;
            gap: 25px; /* Espacio de separación entre los gifs y el texto */
        }

        /* Estilo para el "Cargando..." */
        .texto-carga {
            font-size: 2rem;
        }

        /* Estilo para ajustar el tamaño de los GIFs */
        .gif-carga {
            width: 60px; /* Puedes hacer los GIFs más grandes o pequeños cambiando este número */
            height: auto;
            border-radius: 8px; /* Redondea un poco las esquinas de los GIFs */
        }

        /* Contenedor invisible para el video de YouTube */
        #reproductor-youtube {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
            pointer-events: none;
            z-index: -999;
        }
    </style>
</head>
<body>
    
    <!-- 2. Reemplaza ESTE TEXTO por el nombre real de tu servidor -->
    <div class="titulo-servidor">DonZerekLive</div>
    
    <!-- 3. Contenedor de carga con GIFs -->
    <div class="contenedor-carga">
        <!-- GIF Izquierdo (Reemplaza el link en 'src' por tu propio GIF) -->
        <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ljdTMwYmR4M2VicXdxajVzZ3B5N2Fpb2drbGh5eGdnaGZobjZpdSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/piJXo6lwZH3EqYu81i/giphy.gif" alt="Cargando" class="gif-carga">
        
        <div class="texto-carga">Cargando...</div>
        
        <!-- GIF Derecho (Reemplaza el link en 'src' por tu propio GIF) -->
        <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExc3FodWhka3lxaTVqMmZzaGRvdGp3eTcweTEzajQ1ZjR3bzdrY2R5ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/DH1Au7j1gCGxGOkvUm/giphy.gif" alt="Cargando" class="gif-carga">
    </div>
    
    <!-- Reproductor oculto -->
    <div id="reproductor-youtube"></div>

    <script>
        // 1. Cargar la API de YouTube
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // 2. Configurar el reproductor
        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('reproductor-youtube', {
                videoId: 'T8RTE4ZHhOU', // El ID de "Mi Zapatico"
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'loop': 1,
                    'playlist': 'T8RTE4ZHhOU' 
                },
                events: {
                    'onReady': onPlayerReady
                }
            });
        }

        // 3. Bajar el volumen y darle play
        function onPlayerReady(event) {
            event.target.setVolume(1); 
            event.target.playVideo();
        }
    </script>
</body>
</html>
