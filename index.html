<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cargando Servidor</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #111; 
            color: white;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .titulo-servidor {
            font-size: 4rem;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }

        .contenedor-carga {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .texto-carga {
            font-size: 2rem;
        }

        .gif-carga {
            width: 60px;
            height: auto;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    
    <div class="titulo-servidor">DonZerekLive</div>
    
    <div class="contenedor-carga">
        <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3ljdTMwYmR4M2VicXdxajVzZ3B5N2Fpb2drbGh5eGdnaGZobjZpdSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/piJXo6lwZH3EqYu81i/giphy.gif" alt="Cargando" class="gif-carga">
        <div class="texto-carga">Cargando...</div>
        <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExc3FodWhka3lxaTVqMmZzaGRvdGp3eTcweTEzajQ1ZjR3bzdrY2R5ZCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/DH1Au7j1gCGxGOkvUm/giphy.gif" alt="Cargando" class="gif-carga">
    </div>
    
    <!-- Reproductor de audio nativo (invisible al no tener el atributo 'controls') -->
    <audio id="musica-fondo" autoplay loop></audio>

    <script>
        // 1. LISTA DE CANCIONES EN TU CARPETA "songs"
        // Escribe los nombres exactos de tus archivos (respetando mayúsculas, minúsculas y espacios)
        var listaDeCanciones = [
            'songs/gozalo.mp3',
            'songs/gta.mp3',
            'songs/leche.mp3',
            'songs/nino_dios.mp3',
            'songs/undertale.mp3',
            'songs/zapatico.mp3'
        ];

        // 2. Elegir una canción al azar
        var cancionAleatoria = listaDeCanciones[Math.floor(Math.random() * listaDeCanciones.length)];

        // 3. Asignar la ruta, ajustar volumen y reproducir
        var reproductor = document.getElementById('musica-fondo');
        reproductor.src = cancionAleatoria;
        reproductor.volume = 0.05; // VOLUMEN: va de 0.0 a 1.0 (0.05 equivale al 5%)
    </script>
</body>
</html>
